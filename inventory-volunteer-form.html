<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Volunteer Form - Synergy Inventory</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="inventory.css">
    <link rel="shortcut icon" href="img/synergy.jpeg">
</head>

<body>
    <!-- Header Start -->
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="inventory.html"><span><img src="img/FooterLogo.png" alt=""> </span></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>
            <style>
                .navbar-brand img {
                    width: 80px;
                    height: 40px;
                }
            </style>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="inventory.html" class="nav-link">Home</a></li>
                    <li class="nav-item active"><a href="inventory.html" class="nav-link">Inventory Portal</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- END nav -->

    <div class="container" style="margin-top: 100px; margin-bottom: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="login-card">
                    <h3 class="text-center font-weight-bold text-white mb-4">Student Volunteer Registration</h3>
                    <form id="volunteer-form">
                        <div class="row">
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Full Name</label>
                                <input type="text" class="form-control" id="vol-name" required
                                    placeholder="Enter your full name">
                            </div>
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Enrollment Number</label>
                                <input type="text" class="form-control" id="vol-enrollment" required
                                    placeholder="Enter enrollment no.">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Phone Number</label>
                                <input type="tel" class="form-control" id="vol-phone" required
                                    placeholder="Phone number">
                            </div>
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">College Email ID</label>
                                <input type="email" class="form-control" id="vol-email" required
                                    placeholder="College email">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Personal Email ID</label>
                                <input type="email" class="form-control" id="vol-personal-email" placeholder="Optional">
                            </div>
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">LinkedIn / Instagram ID</label>
                                <input type="text" class="form-control" id="vol-social" placeholder="Social media ID">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label class="text-light">Sports Interested In</label>
                            <select class="form-control" id="vol-sports" required>
                                <option value="" disabled selected>Select a sport...</option>
                                <option value="Basketball">Basketball</option>
                                <option value="Kho Kho">Kho Kho</option>
                                <option value="Volleyball">Volleyball</option>
                                <option value="Football">Football</option>
                                <option value="Athletics">Athletics</option>
                                <option value="Cricket">Cricket</option>
                                <option value="Table Tennis">Table Tennis</option>
                                <option value="Badminton">Badminton</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group mb-4">
                            <label class="text-light">Sports History (School/College Achievements)</label>
                            <textarea class="form-control" id="vol-history" rows="3"
                                placeholder="List any past achievements..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Membership Type</label>
                                <select class="form-control" id="vol-type" required>
                                    <option value="Volunteer">Volunteer</option>
                                    <option value="Core Member">Core Member</option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group mb-4">
                                <label class="text-light">Membership Payment Reference</label>
                                <input type="text" class="form-control" id="vol-payment" required
                                    placeholder="Transaction ID or 'Paid in Cash'">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label class="text-light">Additional Remarks</label>
                            <textarea class="form-control" id="vol-remarks" rows="2"
                                placeholder="Any other details..."></textarea>
                        </div>

                        <button type="submit"
                            class="btn btn-synergy-primary btn-block py-3 mt-2 font-weight-bold">Submit
                            Application</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="inventory.js"></script>
    <script>
        $(document).ready(function () {
            $('#volunteer-form').submit(function (e) {
                e.preventDefault();

                const formData = {
                    id: Date.now(),
                    name: $('#vol-name').val(),
                    enrollment: $('#vol-enrollment').val(),
                    phone: $('#vol-phone').val(),
                    email: $('#vol-email').val(),
                    personalEmail: $('#vol-personal-email').val(),
                    social: $('#vol-social').val(),
                    sports: $('#vol-sports').val(),
                    history: $('#vol-history').val(),
                    type: $('#vol-type').val(),
                    payment: $('#vol-payment').val(),
                    remarks: $('#vol-remarks').val(),
                    status: 'Pending',
                    dateSubmitted: new Date().toISOString().split('T')[0]
                };

                const apps = getVolunteerApps();
                apps.push(formData);
                saveVolunteerApps(apps);

                showToast('Application submitted successfully! Admins will review it soon.', 'success');
                $('#volunteer-form')[0].reset();

                setTimeout(() => window.location.href = 'inventory.html', 2000);
            });
        });
    </script>
</body>

</html>
