<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login - Synergy Inventory Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="css/jquery.timepicker.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Custom Inventory Styles -->
    <link rel="stylesheet" href="inventory.css">
    <link rel="shortcut icon" href="img/synergy.jpeg">
</head>

<body>

    <!-- Header Start -->
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="inventory.html"><span><img src="img/FooterLogo.png" alt="" > </span></a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
	        <span class="oi oi-menu"></span> Menu
	      </button>
            <style>
                .navbar-brand img { width: 80px; height: 40px; }
                .dropdown { position: absolute; display: none; list-style-type: none; border-radius: 6px; margin: auto; padding: 10px; background-color: black; }
                .dropdown li { display: block; margin: auto; padding: 5px 10px; }
                .dropdown li a { text-align: center; color: white; }
                .dropdown::after { content: ""; position: absolute; bottom: 100%; left: 30%; margin-left: -5px; border-width: 5px; border-style: solid; border-color: transparent transparent black transparent; }
                .dropdownMymenu:hover .dropdown { display: block; }
                @media only screen and (max-width: 992px) {
                    .dropdown { display: block; position: initial; background-color: orange; padding: 0px; margin: 0px; }
                    .dropdown li { padding: 5px; }
                    .dropdown li a { text-align: center; color: black; }
                    .navbar-brand { padding: 0px 5px; }
                    .navbar-brand img { width: 60px; height: 30px; }
                }
            </style>
           
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="inventory.html" class="nav-link">Home</a></li>
                    <li class="nav-item active"><a href="inventory.html" class="nav-link">Inventory Portal</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- END nav -->

    <div class="container" style="margin-top: 100px; margin-bottom: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <h3 class="text-center font-weight-bold text-white mb-4">Portal Login</h3>
                    
                    <ul class="nav nav-tabs nav-fill mb-4" id="loginTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active font-weight-bold w-100" id="admin-tab" data-toggle="tab" data-target="#admin" type="button" role="tab" aria-controls="admin" aria-selected="true">Admin</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link font-weight-bold w-100" id="student-tab" data-toggle="tab" data-target="#student" type="button" role="tab" aria-controls="student" aria-selected="false">Student</button>
                        </li>
                    </ul>
                    
                    <div class="tab-content" id="loginTabContent">
                        <!-- Admin Login -->
                        <div class="tab-pane fade show active" id="admin" role="tabpanel" aria-labelledby="admin-tab">
                            <form id="admin-login-form">
                                <div class="form-group mb-4">
                                    <label class="text-light">Username</label>
                                    <input type="text" class="form-control" id="admin-username" required placeholder="Enter admin username">
                                </div>
                                <div class="form-group mb-4">
                                    <label class="text-light">Password</label>
                                    <input type="password" class="form-control" id="admin-password" required placeholder="Enter password">
                                </div>
                                <button type="submit" class="btn btn-synergy-primary btn-block py-2">Login as Admin</button>
                            </form>
                        </div>
                        
                        <!-- Student Login -->
                        <div class="tab-pane fade" id="student" role="tabpanel" aria-labelledby="student-tab">
                            <form id="student-login-form">
                                <div class="form-group mb-4">
                                    <label class="text-light">Volunteer ID</label>
                                    <input type="text" class="form-control" id="student-roll" required placeholder="Enter your Volunteer Number">
                                </div>
                                <div class="form-group mb-4">
                                    <label class="text-light">Password</label>
                                    <input type="password" class="form-control" id="student-password" required placeholder="Enter password">
                                </div>
                                <button type="submit" class="btn btn-synergy-primary btn-block py-2">Login as Volunteer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Code Start -->
    <style>
        #footer { padding: 15px; padding-top: 25px; }
        .text { padding: 0px; text-align: left; }
    </style>
    <footer class="ftco-footer ftco-footer-2 ftco-section" id="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>Copyright &copy; <script>document.write(new Date().getFullYear());</script> All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer Code End -->

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-migrate-3.0.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    
    <!-- Custom Script -->
    <script src="inventory.js"></script>
    <script>
        $(document).ready(function() {
            // Check query params for role
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            if (role === 'student') {
                $('#student-tab').tab('show');
            } else {
                $('#admin-tab').tab('show');
            }

            // Redirect if already logged in
            const auth = getAuth();
            if (auth && auth.loggedIn) {
                if (auth.role === 'admin') {
                    window.location.href = 'inventory-dashboard-admin.html';
                } else if (auth.role === 'student') {
                    window.location.href = 'inventory-dashboard-student.html';
                }
            }

            $('#admin-login-form').submit(function(e) {
                e.preventDefault();
                const username = $('#admin-username').val();
                const password = $('#admin-password').val();
                
                if (login(username, password, 'admin')) {
                    showToast('Login successful. Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'inventory-dashboard-admin.html', 1000);
                } else {
                    showToast('Invalid admin credentials.', 'danger');
                }
            });

            $('#student-login-form').submit(function(e) {
                e.preventDefault();
                const username = $('#student-roll').val();
                const password = $('#student-password').val();
                
                if (login(username, password, 'student')) {
                    showToast('Login successful. Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'inventory-dashboard-student.html', 1000);
                } else {
                    showToast('Invalid credentials. Please enter correct Volunteer ID and Password.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
